services:
  mariadb:
    # Same series as production (10.3.23): this is the compatibility target.
    image: mariadb:10.3
    environment:
      - MYSQL_ROOT_PASSWORD=123456
    volumes:
      - ./create-databases.sql:/docker-entrypoint-initdb.d/setup.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: ../
      dockerfile: docker/Dockerfile.test
    env_file:
      - test.env
    depends_on:
      mariadb:
        condition: service_healthy
